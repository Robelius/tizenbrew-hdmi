<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #fff;
    font-family: "Samsung One", "Helvetica Neue", Arial, sans-serif; cursor: none; }
  #photo { position: fixed; inset: 0; top: 0; left: 0; right: 0; bottom: 0;
    background: #1f5fc9 url(hills.svg) center / cover no-repeat;
    transition: opacity 1.2s ease; }
  #shade { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 65%, rgba(0,0,0,.55) 100%); }
  #clock { position: fixed; top: 5.5vh; right: 4.5vw; text-align: right; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #time { font-size: 7.5vw; font-weight: 300; letter-spacing: -.02em; line-height: 1; }
  #date { font-size: 1.6vw; font-weight: 400; opacity: .85; margin-top: 1vh; }
  #note { position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center; font-size: 1.4vw;
    letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,.6); opacity: .9; }
  #dot { display: inline-block; width: .6vw; height: .6vw; border-radius: 50%; margin-right: .8vw;
    vertical-align: middle; background: #8a8f99; }
  #note.on #dot { background: #3ddc84; box-shadow: 0 0 .8vw #3ddc84; }
  #diag { position: fixed; left: 3vw; top: 4vh; max-width: 45vw; padding: 1.2vw 1.6vw; display: none;
    background: rgba(0,0,0,.75); border-radius: .8vw; font: 1vw/1.5 Menlo, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="photo"></div>
<div id="shade"></div>
<div id="clock"><div id="time"></div><div id="date"></div></div>
<div id="note"><span id="dot"></span><span id="status">HDMI 2</span></div>
<div id="diag"></div>
<script>
(function () {
  var HDMI_PORT = 2;
  var onTV = typeof tizen !== 'undefined';
  var diag = { tizen: onTV, videosource: 'not checked', photo: 'loading', lastPoll: '-' };
  var simulated = false;

  // Photo: app/photo.jpg next to this page; falls back to hills.svg.
  var img = new Image();
  img.onload = function () {
    document.getElementById('photo').style.backgroundImage = 'url(photo.jpg)';
    diag.photo = 'photo.jpg';
  };
  img.onerror = function () { diag.photo = 'hills.svg'; };
  img.src = 'photo.jpg';

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];

  function tick() {
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    var m = ('0' + d.getMinutes()).slice(-2);
    document.getElementById('time').textContent = h + ':' + m;
    document.getElementById('date').textContent =
      DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  }

  function setConnected(on) {
    document.getElementById('note').className = on ? 'on' : '';
    document.getElementById('status').textContent = on ? 'HDMI 2 · Console on' : 'HDMI 2 · Console off';
  }

  function poll() {
    diag.lastPoll = new Date().toLocaleTimeString();
    if (!onTV) { setConnected(simulated); diag.videosource = 'browser preview (press H)'; return; }
    try {
      tizen.systeminfo.getPropertyValue('VIDEOSOURCE', function (s) {
        var on = false, names = [];
        (s.connected || []).forEach(function (v) {
          names.push(v.type + v.number);
          if (v.type === 'HDMI' && v.number === HDMI_PORT) on = true;
        });
        diag.videosource = 'connected: ' + (names.join(', ') || 'none');
        setConnected(on);
      }, function (e) { diag.videosource = 'error: ' + e.message; });
    } catch (e) { diag.videosource = 'error: ' + e.message; }
  }

  function renderDiag() {
    document.getElementById('diag').textContent =
      'TV Home diagnostics\n\n' +
      'tizen API:   ' + diag.tizen + '\n' +
      'HDMI inputs: ' + diag.videosource + '\n' +
      'photo:       ' + diag.photo + '\n' +
      'last check:  ' + diag.lastPoll + '\n\n' +
      'Blue: hide';
  }

  document.addEventListener('keydown', function (e) {
    var blue = e.keyCode === 406 || e.key === 'ColorF3Blue' || e.key === 'b';
    if (blue) {
      var el = document.getElementById('diag');
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
      renderDiag();
    }
    if (!onTV && (e.key === 'h' || e.key === 'H')) { simulated = !simulated; poll(); }
  });

  tick(); poll();
  setInterval(tick, 1000);
  setInterval(function () { poll(); renderDiag(); }, 3000);
})();
</script>
</body>
</html>
